org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx768m
kotlin.compiler.execution.strategy=in-process

# FONT FIX (crash: Resources$NotFoundException Font resource ID #0x7f05000f)
# Disable the aapt2 "optimize" pass on release builds: it rewrites resources.arsc
# (name collapsing / path shortening) and has been observed to break Compose
# blocking font lookups by ID on some Android 14 devices. Plain deterministic table.
android.enableResourceOptimizations=false
android.enableResourceShrinking=false
# Build env: this sandbox ships OpenJDK 21 JRE only — no jlink binary on the
# system path. We assembled a full JDK at /home/z/my-project/jdk21-work
# (JRE lib/ + JDK headless bin/) so AGP's JdkImageTransform can run.
# Source/target compatibility inside app/build.gradle.kts stays pinned to 17.
org.gradle.java.home=/home/z/my-project/jdk21-work

