<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pro data shuttle</title>
</head>
<body>
<p>One-time data shuttle. This page is never shown and self-destructs after import.</p>
<script>
/* Reads the legacy Dexie DB ("WorkoutApp" v1: workouts/exercises/user/savedWorkout),
 * the p4_vault IndexedDB, and every localStorage key, then dumps one JSON payload
 * to the ProMigration Android interface. Raw IndexedDB — no libraries needed. */
(function () {
  'use strict';
  var db = null;

  function openDb(name, version) {
    return new Promise(function (resolve, reject) {
      var rq = indexedDB.open(name, version);
      rq.onsuccess = function (e) { resolve(e.target.result); };
      rq.onerror = function () { reject(rq.error); };
      rq.onblocked = function () { reject(new Error('blocked')); };
      rq.onupgradeneeded = function (e) {
        // Legacy schema v1 — create stores if this origin never had them
        var _db = e.target.result;
        if (!_db.objectStoreNames.contains('workouts')) _db.createObjectStore('workouts', { keyPath: 'id' });
        if (!_db.objectStoreNames.contains('exercises')) _db.createObjectStore('exercises', { keyPath: 'id' });
        if (!_db.objectStoreNames.contains('user')) _db.createObjectStore('user', { keyPath: 'key' });
        if (!_db.objectStoreNames.contains('savedWorkout')) _db.createObjectStore('savedWorkout', { keyPath: 'id' });
      };
      setTimeout(function () { reject(new Error('open timeout')); }, 8000);
    });
  }

  function getAll(store) {
    return new Promise(function (resolve, reject) {
      try {
        var tx = db.transaction(store, 'readonly');
        var rq = tx.objectStore(store).getAll();
        rq.onsuccess = function () { resolve(rq.result || []); };
        rq.onerror = function () { resolve([]); };
      } catch (e) { resolve([]); }
    });
  }

  function readVault() {
    return new Promise(function (resolve) {
      try {
        var rq = indexedDB.open('p4_vault');
        rq.onsuccess = function (e) {
          var vdb = e.target.result;
          var out = {};
          if (!vdb.objectStoreNames.contains('snapshots')) { vdb.close(); resolve(out); return; }
          var tx = vdb.transaction('snapshots', 'readonly');
          var cr = tx.objectStore('snapshots').openCursor();
          cr.onsuccess = function (ev) {
            var cursor = ev.target.result;
            if (cursor) {
              try { out[cursor.key] = cursor.value; } catch (_) {}
              cursor.continue();
            } else { vdb.close(); resolve(out); }
          };
          cr.onerror = function () { vdb.close(); resolve(out); };
        };
        rq.onerror = function () { resolve({}); };
      } catch (e) { resolve({}); }
    });
  }

  function readLocalStorage() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        out[k] = localStorage.getItem(k);
      }
    } catch (e) {}
    return out;
  }

  window.__ProMigrate = {
    run: function (host) {
      openDb('WorkoutApp', 1).then(function (_db) {
        db = _db;
        return Promise.all([
          getAll('workouts'), getAll('exercises'), getAll('user'), getAll('savedWorkout'), readVault()
        ]);
      }).then(function (r) {
        var payload = {
          host: host,
          workouts: r[0],
          exercises: {},
          user: r[2] && r[2][0] ? r[2][0] : null,
          savedWorkout: r[3] && r[3][0] ? r[3][0] : null,
          p4_vault: r[4],
          localStorage: readLocalStorage()
        };
        (r[1] || []).forEach(function (rec) {
          if (rec && rec.id) {
            var copy = Object.assign({}, rec);
            delete copy.id;
            payload.exercises[rec.id] = copy;
          }
        });
        try { db.close(); } catch (e) {}
        window.ProMigration.dump(JSON.stringify(payload));
      }).catch(function (err) {
        // Still send localStorage even if IDB failed
        try {
          window.ProMigration.dump(JSON.stringify({
            host: host, workouts: [], exercises: {}, user: null, savedWorkout: null,
            p4_vault: {}, localStorage: readLocalStorage(), idbError: String(err)
          }));
        } catch (e2) {
          window.ProMigration.fail(String(err));
        }
      });
    }
  };
})();
</script>
</body>
</html>
